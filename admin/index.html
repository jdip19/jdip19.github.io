<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>QuickText License Admin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101114;
        color: #f5f5f5;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0, rgba(249, 115, 22, .14), transparent 42%),
          #101114;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #303137;
        border-radius: 20px;
        background: rgba(24, 25, 29, .96);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #fb923c;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: 26px; letter-spacing: -.03em; }
      .intro { margin: 10px 0 26px; color: #a1a1aa; line-height: 1.55; }
      label { display: block; margin: 18px 0 8px; color: #d4d4d8; font-size: 14px; font-weight: 600; }

      input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #3f4047;
        border-radius: 10px;
        outline: none;
        background: #111216;
        color: #fff;
        font: inherit;
      }

      input:focus { border-color: #fb923c; box-shadow: 0 0 0 3px rgba(251, 146, 60, .16); }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        background: #f97316;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:hover { background: #ea580c; }
      button:disabled { cursor: wait; opacity: .65; }

      .secondary {
        width: auto;
        min-height: 36px;
        margin: 0;
        padding: 0 12px;
        border: 1px solid #414149;
        background: transparent;
        color: #d4d4d8;
        font-size: 13px;
      }

      .secondary:hover { background: #292a30; }
      .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

      .status {
        min-height: 22px;
        margin: 14px 0 0;
        color: #fca5a5;
        font-size: 14px;
        line-height: 1.5;
      }

      .status[data-kind="success"] { color: #86efac; }
      [hidden] { display: none !important; }

      .license {
        margin-top: 24px;
        padding: 18px;
        border: 1px solid #5b351e;
        border-radius: 12px;
        background: #21170f;
      }

      .license-label { margin: 0 0 10px; color: #fdba74; font-size: 13px; }

      code {
        display: block;
        overflow-wrap: anywhere;
        color: #fff7ed;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: .04em;
      }

      .copy { margin-top: 14px; }
      .fine-print { margin: 22px 0 0; color: #71717a; font-size: 12px; line-height: 1.5; }

      @media (max-width: 480px) {
        main { padding: 24px; }
        .topline { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">QuickText</p>
      <section id="login-view">
        <h1>License admin</h1>
        <p class="intro">Sign in to issue a Pro license key.</p>
        <form id="login-form">
          <label for="admin-password">Admin password</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
          <button id="login-button" type="submit">Sign in</button>
        </form>
      </section>

      <section id="admin-view" hidden>
        <div class="topline">
          <div>
            <h1>Generate a key</h1>
            <p class="intro">Create an unlimited QuickText Pro license.</p>
          </div>
          <button id="logout-button" class="secondary" type="button">Sign out</button>
        </div>
        <form id="license-form">
          <label for="license-email">Customer email</label>
          <input id="license-email" name="email" type="email" autocomplete="email" maxlength="254" required />
          <button id="generate-button" type="submit">Generate license key</button>
        </form>
        <div id="result" class="license" hidden>
          <p class="license-label">New QuickText Pro key</p>
          <code id="license-key"></code>
          <button id="copy-button" class="secondary copy" type="button">Copy key</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="fine-print">Access is checked by the license service. Keep generated keys private and share them only with their intended recipient.</p>
    </main>

    <script>
      (() => {
        const FUNCTION_URL = "https://kmkjuuytbgpozrigspgw.supabase.co/functions/v1/admin-licenses";
        const SESSION_KEY = "quicktext-admin-session";
        const loginView = document.getElementById("login-view");
        const adminView = document.getElementById("admin-view");
        const loginForm = document.getElementById("login-form");
        const licenseForm = document.getElementById("license-form");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const keyElement = document.getElementById("license-key");
        let sessionToken = sessionStorage.getItem(SESSION_KEY) || "";

        function setStatus(message, kind) {
          status.textContent = message;
          status.dataset.kind = kind || "error";
        }

        function showAdmin() {
          loginView.hidden = true;
          adminView.hidden = false;
          setStatus("", "");
        }

        function showLogin() {
          loginView.hidden = false;
          adminView.hidden = true;
          sessionToken = "";
          sessionStorage.removeItem(SESSION_KEY);
        }

        async function request(action, payload, token) {
          const headers = { "Content-Type": "application/json" };
          if (token) headers.Authorization = `Bearer ${token}`;
          const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers,
            body: JSON.stringify({ action, ...payload }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            const error = new Error(data.error || "The request could not be completed.");
            error.status = response.status;
            throw error;
          }
          return data;
        }

        loginForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = document.getElementById("login-button");
          button.disabled = true;
          setStatus("Signing in…", "working");
          try {
            const password = new FormData(loginForm).get("password");
            const data = await request("login", { password });
            sessionToken = data.token;
            sessionStorage.setItem(SESSION_KEY, sessionToken);
            loginForm.reset();
            showAdmin();
          } catch (error) {
            setStatus(error.message || "Sign-in failed.");
          } finally {
            button.disabled = false;
          }
        });

        licenseForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = document.getElementById("generate-button");
          button.disabled = true;
          result.hidden = true;
          setStatus("Creating license…", "working");
          try {
            const email = new FormData(licenseForm).get("email");
            const data = await request("create-license", { email }, sessionToken);
            keyElement.textContent = data.licenseKey;
            result.hidden = false;
            setStatus(`License created for ${data.email}.`, "success");
            licenseForm.reset();
          } catch (error) {
            if (error.status === 401) showLogin();
            setStatus(error.message || "License creation failed.");
          } finally {
            button.disabled = false;
          }
        });

        document.getElementById("logout-button").addEventListener("click", () => {
          showLogin();
          setStatus("You have signed out.", "success");
        });

        document.getElementById("copy-button").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(keyElement.textContent);
            setStatus("License key copied.", "success");
          } catch {
            setStatus("Copy failed. Select and copy the key manually.");
          }
        });

        if (sessionToken) {
          request("session", {}, sessionToken)
            .then(showAdmin)
            .catch(showLogin);
        }
      })();
    </script>
  </body>
</html>
